# yaml-language-server: $schema=../../docs/schema.json

meta:
  title: "Remotionで解説動画を作る"
  aspect: "16:9"        # 16:9 | 9:16
  fps: 30

# 話者のエイリアス定義。声を差し替えたくなったらここだけ直す
# color は字幕の色。立ち絵が無い構成では、話者が変わったことは字幕の色でしか分からない
speakers:
  zundamon:
    engine: voicevox
    styleId: 3
    color: "#69C6A0"
  metan:
    engine: voicevox
    styleId: 2
    speedScale: 1.05
    color: "#E86B8F"

defaults:
  speaker: zundamon
  transition: fade
  gapMs: 300            # 同じシーン内のセリフ間の余白
  sceneGapMs: 100       # シーンの末尾（＝シーン間と動画末尾）の余白

scenes:
  - image: assets/01-title.png
    transition: fade
    lines:
      # 読み上げる文字列 (text) と、字幕に出す文字列 (caption) は分けられる。
      # 聞いたことのない言葉ほど VOICEVOX は正しく読まないので text には読み仮名を書くが、
      # それをそのまま字幕に出すと視聴者は綴りを受け取れず、その言葉を検索できない
      - text: 今日はリモーションの話をするのだ
        caption: 今日は Remotion の話をするのだ
      - speaker: metan
        text: |
          スライドショー形式の
          解説動画を作りますね

  - image: assets/02-overview.png
    lines:
      - text: まず台本を書くのだ
      - text: あとはCLIが音声を作ってくれるのだ
