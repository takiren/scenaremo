name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-and-vuln:
    name: Lint and Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Path to go.mod, go.work, .go-version, or .tool-versions file
          #
          # go-version は指定しない。両方を渡すと go-version が優先され、'1.26' のような
          # 範囲指定はその時点で setup-go が知っている最新（例: 1.26.5）に解決されるため、
          # go.mod が要求する版に届かないことがある。setup-go は GOTOOLCHAIN=local を
          # 立てるので、そのとき go は自分で新しい toolchain を取りに行けず、
          # golangci-lint が「go.mod requires go >= X」で落ちる。
          # build-and-test ジョブと同じく、版の正は go.mod 1 箇所にしておく。
          go-version-file: 'go.mod'

          # Set this option if you want the action to check for the latest available version
          # Default: false
          check-latest: false

          # GitHub token for authentication
          token: ${{ github.token }}

          # Used to specify whether caching is needed.
          # Default: true
          cache: true

          # Path to dependency files for caching
          cache-dependency-path: 'go.sum'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -v ./...

      # -race を付けるのは、合成が --parallel で並列に動くようになったため。
      # 競合は「たまに落ちる」形で現れるので、素の go test では踏むまで気づけない。
      # 実際 fakeStore の concurrent map writes は、無関係な PR の CI で初めて表に出た。
      # 手元の実測で 2.6s → 3.6s なので、遅さを理由に外す段階ではない。
      - name: Test
        run: go test -v -race ./...

  renderer:
    name: Renderer Typecheck and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # defaults.run.working-directory は run: にしか効かないので、
          # アクションには packageManager を読む先を明示する必要がある。
          package_json_file: 'renderer/package.json'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'renderer/pnpm-lock.yaml'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
