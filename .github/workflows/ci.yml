name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-and-vuln:
    name: Lint and Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Version or version range of Go to use
          go-version: '1.26'

          # Path to go.mod, go.work, .go-version, or .tool-versions file
          # Note: if both go-version and go-version-file are provided, go-version takes precedence.
          go-version-file: 'go.mod'

          # Set this option if you want the action to check for the latest available version
          # Default: false
          check-latest: false

          # GitHub token for authentication
          token: ${{ github.token }}

          # Used to specify whether caching is needed.
          # Default: true
          cache: true

          # Path to dependency files for caching
          cache-dependency-path: 'go.sum'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, linux-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
